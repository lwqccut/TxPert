[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txpert-llm-agent"
version = "0.1.0"
description = "Qwen-based evidence-guided gene perturbation agent for TxPert"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
txpert-agent = "LLM_agent.run:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["LLM_agent*"]
