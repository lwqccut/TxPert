# One-command defaults.  Set model.enabled=true to load Qwen locally.
model:
  name: Qwen/Qwen2.5-7B-Instruct
  cache_dir: ./LLM_agent/models
  enabled: true
  device: auto
  dtype: float16
  max_new_tokens: 768
  temperature: 0.0
  auto_install: true
agent:
  role: knowledge_analysis
  explain_mechanism: false
retrieval:
  # Existing TxPert resources only; no generated/example corpus is used.
  kg_paths:
    - data/graphs/string/v11.5.parquet
    - data/graphs/go/go_top_50.csv
  rag_paths:
    []
  embedding_model: BAAI/bge-m3
  top_k: 8
forward:
  # Use txpert for the released TxPert checkpoint, or custom_forward for a
  # checkpoint trained by forward_model/train.py.
  backend: txpert
  checkpoint: K562_unseen_pert_gat.ckpt
  device: auto
  datamodule:
    mode: inference
    task_type: K562_single_cell_line
    match_cntr: true
    avg_cntr: true
    embed_cntr: true
    obsm_key: raw
  graph_cfg:
    graph1:
      graph_type: string
      reduce2perts: true
      norm_weights: false
      mode: top_20
  model:
    model_type: txpert
    no_basal_model: false
    no_pert_model: false
    hidden_dim: 512
    latent_dim: 64
    dropout: 0.2
    use_batch_norm: true
    use_layer_norm: false
    omit_cntr: false
    mse_weight: 1
    cntr_model:
      model_type: mlp
      rank: 16
      decode_latent: false
      use_batch_norm: true
      use_layer_norm: false
    pert_model:
      model_type: gnn
      layer_type: gat_v2
      num_layers: 4
      hidden_dim: 128
      skip: skip_cat
      dropout: 0.2
      num_heads: 2
      concat: true
      add_self_loops: true
      use_edge_weight: false
      use_struc_feat: false
output:
  dir: ./LLM_agent/runs
knowledge_training:
  feature_path: ./LLM_agent/runs/knowledge_features.pt
  model_path: ./LLM_agent/runs/knowledge_forward.pt
  freeze_base: false
