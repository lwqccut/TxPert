# Use an OpenAI-compatible local server, for example vLLM.
endpoint: http://127.0.0.1:8000/v1
model: Qwen/Qwen3-32B
# Required for live runs: exact Hugging Face commit used by the model server.
revision: null
# Document the actual server precision/quantization; this client cannot verify it.
precision: bfloat16
api_key_env: REACTIVE_LLM_API_KEY
temperature: 0.0
seed: 1
max_tokens: 1024
timeout_seconds: 90
interval_steps: 500
# Evidence mode: minimum optimizer steps between decisions, not unconditional calls.
# interval is available only as a fixed-frequency ablation/transport smoke test.
decision_trigger: evidence
trend_window: 50
trend_sample_every: 10
event_loss_ratio: 1.25
event_grad_ratio: 2.0
event_fraction: 0.8
# After two consecutive unchanged decisions, wait 2, then 4, then 8 new validations.
# Fresh regression or a sustained training event can bypass this backoff.
hold_backoff_after: 2
hold_backoff_max_validations: 8
history_size: 8
lr_factor_min: 0.5
lr_factor_max: 1.2
lr_min: 0.000001
lr_max: 0.01
weight_decay_max: 0.1
# Existing Trainer clipping settings take precedence at initialization.
clip_norm: 1.0
clip_min: 0.1
clip_max: 10.0
# Deterministic validation feedback; no further LLM action while a trial is pending.
feedback_enabled: true
feedback_metric: pearson_delta
# Absolute Pearson delta gain/drop; MSE regression remains an additional guard.
feedback_pearson_improvement: 0.005
feedback_pearson_regression: 0.01
feedback_min_steps: 500
feedback_baseline_max_age_steps: 5000
feedback_improvement: 0.01
feedback_regression: 0.05
feedback_patience: 2
feedback_max_evaluations: 4
feedback_cooldown_steps: 500
